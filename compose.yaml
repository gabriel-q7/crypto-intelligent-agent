services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Baixa o modelo uma única vez; o volume persistente evita novo download.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Sempre pelo nome do serviço dentro da rede do Compose.
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
