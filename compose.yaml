services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Baixa o modelo configurado em OLLAMA_MODEL; o volume persistente evita novo download.
  # Trocar de modelo: OLLAMA_MODEL=gemma4:e4b docker compose run --rm app ...
  # (o app depende deste serviço, então o novo modelo é baixado automaticamente).
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    # Baixa o modelo de chat e o de embeddings (base de conhecimento); ambos ficam no volume ollama_models.
    entrypoint: ["sh", "-c", "ollama pull \"$$CHAT_MODEL\" && ollama pull \"$$EMBEDDING_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Sempre pelo nome do serviço dentro da rede do Compose.
      OLLAMA_BASE_URL: http://ollama:11434
      # Interpolado pelo Compose: variável do shell > .env > padrão.
      # Garante que o app use o mesmo modelo baixado pelo ollama-pull.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_REASONING: ${OLLAMA_REASONING-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      # Desliga a telemetria anônima do Chroma (também desligada no código).
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      # Resultados de benchmark persistidos no host.
      - ./benchmarks/results:/app/benchmarks/results
      # Coleção Chroma persistida no host (POST /knowledge/ingest).
      - ./data:/app/data
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
