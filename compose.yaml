services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Baixa o modelo configurado em OLLAMA_MODEL; o volume persistente evita novo download.
  # Trocar de modelo: OLLAMA_MODEL=gemma4:e4b docker compose run --rm app ...
  # (o app depende deste serviço, então o novo modelo é baixado automaticamente).
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma4:e2b}"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Sempre pelo nome do serviço dentro da rede do Compose.
      OLLAMA_BASE_URL: http://ollama:11434
      # Interpolado pelo Compose: variável do shell > .env > padrão.
      # Garante que o app use o mesmo modelo baixado pelo ollama-pull.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_REASONING: ${OLLAMA_REASONING-false}
    volumes:
      # Resultados de benchmark persistidos no host.
      - ./benchmarks/results:/app/benchmarks/results
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
